# Whole search engine in one command:   docker compose up --build
#   - web interface:      http://localhost:5000
#   - search API (docs):  http://localhost:8000/docs
# Re-import the documents from Reddit and Arxiv (optional, overwrites data/database.json):
#   docker compose run --rm scrap

services:
  api:
    build: ./source/backend
    ports:
      - "8000:8000"
    volumes:
      # EnvironmentManager reads /app/.env; the corpus is stored in /app/<STORAGE_DIR>.
      - ./.env:/app/.env:ro
      - ./data:/app/data
    healthcheck:
      # The API answers only once the matrices are built.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs')"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 180s
      start_interval: 3s

  web:
    build: ./source/frontend
    ports:
      - "5000:5000"
    environment:
      SEARCH_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

  scrap:
    build: ./source/backend
    command: ["python", "-m", "script.scrap_data"]
    volumes:
      - ./.env:/app/.env:ro
      - ./data:/app/data
    profiles:
      - scrap
